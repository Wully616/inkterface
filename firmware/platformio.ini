[env]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
extra_scripts =
    pre:autorev.py
lib_deps =
    adafruit/Adafruit EPD
    adafruit/Adafruit MAX1704X
    h2zero/NimBLE-Arduino

# support for V1 feather: https://www.adafruit.com/product/5477
[env:featherv1]
board = adafruit_feather_esp32s3
build_flags =
    '-D EPD_EN=(6)'
    '-D EPD_BUSY=(9)'
    '-D EPD_RESET=(10)'
    '-D SRAM_CS=(11)'
    '-D EPD_DC=(12)'
    '-D EPD_CS=(13)'
# you can add '-D STARTUP_DELAY_MS=5000'
# or similar to delay initial startup which can be useful for debugging

# support for V2 feather: https://www.adafruit.com/product/5400
[env:featherv2]
board = adafruit_feather_esp32_v2
build_flags =
    '-D EPD_EN=(32)'
    '-D EPD_BUSY=(15)'
    '-D EPD_RESET=(33)'
    '-D SRAM_CS=(27)'
    '-D EPD_DC=(12)'
    '-D EPD_CS=(13)'

# Waveshare ESP32-S3-LCD-5B (ESP32-S3-WROOM-1-N16R8, ST7262 RGB 1024x600)
[env:lcd5b]
; Core 2's ESP-IDF 4.4 RGB driver and Arduino_GFX setup expose only one
; framebuffer. Use the pinned pioarduino platform for ESP-IDF 5.5's RGB LCD
; double-buffer support; the Feather environments continue to use upstream.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = waveshare_esp32_s3_lcd_5b
custom_sdkconfig = file://sdkconfig.lcd5b.defaults
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit MAX1704X
    h2zero/NimBLE-Arduino
board_build.flash_mode = qio
board_build.f_flash = 80000000L
; The LCD renderer is CPU and memory-bandwidth bound; use the performance
; optimization level recommended for ESP-IDF LCD workloads.
build_unflags = -Os
build_flags =
    -O2
    '-D INKTERFACE_LCD5B'
    '-D ARDUINO_USB_CDC_ON_BOOT=1'

# Standalone LCD renderer stress test. This target skips BLE and runs a moving
# frame pattern at several rates so the panel path can be tested by itself.
[env:lcd5b_animation]
extends = env:lcd5b
build_flags =
    ${env:lcd5b.build_flags}
    '-D LCD5B_ANIMATION_TEST'

# Minimal application startup check (no display, buses, Bluetooth, or drivers).
[env:lcd5b_minimal_serial_test]
extends = env:lcd5b
board_build.flash_mode = dio
board_build.f_flash = 80000000L
upload_speed = 115200
build_src_filter = -<*> +<minimal_serial_test.cpp>
lib_deps =
extra_scripts =
build_flags =
    ${env:lcd5b.build_flags}
    '-D LCD5B_MINIMAL_SERIAL_TEST'
