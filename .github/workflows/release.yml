name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build all board variants
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail

          for env in featherv1 featherv2 lcd5b; do
            echo "Building ${env}"
            pio run -e "$env" -t buildprog
            for image in bootloader.bin partitions.bin firmware.bin; do
              build_dir=".pio/build/$env"
              canonical_path="${build_dir}/${image}"

              # Accept an image from anywhere under this environment's build
              # directory, then normalize its path for the merge step below.
              if [[ ! -s "$canonical_path" ]]; then
                found_path="$(find "$build_dir" -type f -name "$image" -size +0c -print -quit)"
                if [[ -n "$found_path" ]]; then
                  cp "$found_path" "$canonical_path"
                fi
              fi

              if [[ ! -s "$canonical_path" ]]; then
                echo "Missing firmware artifact: $canonical_path" >&2
                echo "Generated files under ${build_dir}:" >&2
                find "$build_dir" -maxdepth 5 -type f -print >&2 || true
                exit 1
              fi
            done
          done

      - name: Merge flashable images
        working-directory: firmware
        run: |
          set -euo pipefail
          BOOT_APP0=$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          test -s "$BOOT_APP0" || {
            echo "Missing Arduino boot_app0 image: $BOOT_APP0" >&2
            exit 1
          }
          # feather v1 is an esp32-s3, bootloader lives at 0x0
          python -m esptool --chip esp32s3 merge-bin -o inkterface-featherv1.bin \
            0x0 .pio/build/featherv1/bootloader.bin \
            0x8000 .pio/build/featherv1/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 .pio/build/featherv1/firmware.bin
          # feather v2 is a classic esp32, bootloader lives at 0x1000
          python -m esptool --chip esp32 merge-bin -o inkterface-featherv2.bin \
            0x1000 .pio/build/featherv2/bootloader.bin \
            0x8000 .pio/build/featherv2/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 .pio/build/featherv2/firmware.bin
          # Waveshare LCD-5B is an ESP32-S3 with 16 MB QIO flash.
          python -m esptool --chip esp32s3 merge-bin --flash-mode qio --flash-size 16MB \
            -o inkterface-lcd5b.bin \
            0x0 .pio/build/lcd5b/bootloader.bin \
            0x8000 .pio/build/lcd5b/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 .pio/build/lcd5b/firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/inkterface-*.bin

  appimage:
    name: Build AppImage
    # pinned to 22.04 so the AppImage runs on a wide range of glibc versions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq build-essential cmake ninja-build patchelf \
            desktop-file-utils file libfuse2 libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-icccm4-dev libxcb-sync-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxcb-util-dev libxcb-cursor-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev libglu1-mesa-dev \
            libssl-dev libpulse-dev libasound2-dev libudev-dev

      - name: Install Qt
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop 6.9.0 linux_gcc_64 \
            --outputdir "$HOME/qt" --modules qtserialport qtconnectivity

      - name: Build and package
        run: |
          export PATH="$HOME/qt/6.9.0/gcc_64/bin:$PATH"
          export CMAKE_PREFIX_PATH="$HOME/qt/6.9.0/gcc_64"
          bash scripts/build.sh deploy

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            dist-linux-x86_64/Inkterface.AppImage
            dist-linux-x86_64/launch.sh

  release:
    name: Publish release
    needs: [firmware, appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Inkterface.AppImage
            inkterface-featherv1.bin
            inkterface-featherv2.bin
            inkterface-lcd5b.bin

  pages:
    name: Deploy web flasher
    needs: [firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - uses: actions/deploy-pages@v4
